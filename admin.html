<body class="admin-page"><div class="admin-hills" aria-hidden="true"></div><main class="admin-shell">
  <a class="admin-back" href="wish.html">← 回到 Wish Room</a><h1>願望審核</h1>
  <p class="admin-lede">登入狀態與訪客匿名身分分開，只有已授權的管理員可以讀取。</p>
  <form id="admin-login">
    <label for="admin-email">管理員 Email</label><input id="admin-email" type="email" autocomplete="username" required>
    <label for="admin-password">密碼</label><input id="admin-password" type="password" autocomplete="current-password" required>
    <button type="submit" disabled>登入管理員</button>
  </form>
  <p id="admin-status" role="status">尚未登入。</p>
  <section id="admin-panel" hidden aria-labelledby="queue-title">
    <div class="admin-toolbar"><h2 id="queue-title">所有願望</h2><button id="admin-refresh">重新讀取</button><button id="admin-signout">登出</button></div>
    <div class="admin-tabs" role="group" aria-label="依審核狀態篩選"><button data-status="pending" aria-pressed="true">待審核</button><button data-status="approved" aria-pressed="false">已公開</button><button data-status="rejected" aria-pressed="false">已拒絕</button></div>
    <p id="admin-tab-hint"></p>
    <ul id="admin-wishes"></ul>
    <button id="admin-more" hidden>載入更多</button>
  </section>
  <noscript>請啟用 JavaScript。權限仍由 Firestore Security Rules 控制。</noscript>
</main></body></html>
