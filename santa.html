<section class="cabin" aria-labelledby="cabin-title">

  <h1 class="sr-only" id="cabin-title" lang="en">Santa's Cabin</h1>
  <div class="cabin-stage" id="cabin-stage" data-state="loading" data-progress="0" data-view="outside" aria-busy="true">

    <button class="cabin-gesture" type="button" aria-label="聖誕村：左右拖曳環顧四周，點小屋推門進去，點院子裡的東西看看；按 Enter 進屋或回到屋外" aria-describedby="cabin-status"></button>
    <button class="cabin-back" id="cabin-back" type="button" hidden>← 回到小屋</button>

  </div>

  <nav class="cabin-explore" aria-label="探索聖誕村">
