<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intro 尺寸驗收</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#edf3f4;font:14px system-ui;color:#344d57}header{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,a{min-height:44px;padding:6px 10px}#stage{margin:12px auto}iframe{display:block;border:0;transform-origin:top left}output{display:block;margin:10px 0;line-height:1.5;min-height:3em}#events{font-size:12px}</style><header><b>正式 Intro 尺寸驗收</b><a href="?viewport=desktop">1440×900</a><a href="?viewport=laptop">1366×768</a><a href="?viewport=tablet">768×1024</a><a href="?viewport=mobile">390×844</a><button data-section="intro-storybook">故事書</button><button data-section="christmas-cultures">世界地圖</button><button id="measure">量測</button><a href="?viewport=desktop&amp;slow=1">慢速檢查翻頁</a></header><output id="state" role="status">載入中……</output><div id="events"></div><div id="stage"><iframe id="frame" title="正式 Intro 響應式驗收" src="../intro.html"></iframe></div><script type="module">
const sizes={desktop:[1440,900],laptop:[1366,768],tablet:[768,1024],mobile:[390,844]},params=new URLSearchParams(location.search);
const [width,height]=sizes[params.get('viewport')]||sizes.desktop;
const frame=document.querySelector('#frame'),stage=document.querySelector('#stage'),state=document.querySelector('#state'),events=document.querySelector('#events');
function layout(){const scale=Math.min(1,(document.documentElement.clientWidth-24)/width,(innerHeight-175)/height);Object.assign(frame.style,{width:width+'px',height:height+'px',transform:`scale(${scale})`});Object.assign(stage.style,{width:width*scale+'px',height:height*scale+'px'});}
function measure(){const d=frame.contentDocument;if(!d.querySelector('.intro-book'))return;const rect=s=>d.querySelector(s).getBoundingClientRect(),book=rect('.intro-book'),scene=rect('.intro-scene'),controls=rect('.intro-book-controls'),active=d.querySelector('.intro-copy[data-active="true"]'),dialog=d.querySelector('#culture-dialog');
const baseline=[...d.querySelectorAll('.intro-scene-page[data-active="true"] .piece-stable,.intro-scene-page[data-active="true"] .piece-cottage,.intro-scene-page[data-active="true"] .piece-house')].map(x=>Math.round(x.getBoundingClientRect().bottom-scene.top));
state.textContent=`${width}×${height} · ${d.documentElement.scrollWidth>d.documentElement.clientWidth?'有水平溢出':'無水平溢出'} · Header ${Math.round(rect('.site-header').height)} · 書 ${Math.round(book.width)}×${Math.round(book.height)}（底 ${Math.round(book.bottom)}） · 舞台 ${Math.round(scene.width)}×${Math.round(scene.height)} · 控制列底 ${Math.round(controls.bottom)} · 內文 ${getComputedStyle(active.querySelector('.intro-story')).fontSize}／${active.querySelectorAll('.intro-story p').length}段 · ${d.querySelector('[data-book="count"]').textContent} · ${d.querySelector('#intro-storybook').dataset.phase} · 地面 ${baseline.join(',')} · scrollY ${Math.round(frame.contentWindow.scrollY)} · 地圖頂 ${Math.round(rect('#christmas-cultures').top)} · snap ${getComputedStyle(d.documentElement).scrollSnapType}${dialog.open?' · 明信片開啟':''}`;
}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{frame.contentDocument.getElementById(b.dataset.section).scrollIntoView({behavior:'instant'});measure();});document.querySelector('#measure').onclick=measure;
frame.onload=()=>{layout();const d=frame.contentDocument;let log=[];new MutationObserver(m=>{if(m.some(x=>x.attributeName==='data-phase')){if(params.has('slow'))for(const a of d.getAnimations())a.updatePlaybackRate(.18);log.push(d.querySelector('#intro-storybook').dataset.phase);events.textContent='動畫順序：'+log.slice(-16).join(' → ');}measure();}).observe(d.querySelector('#intro-storybook'),{attributes:true,subtree:true});new MutationObserver(measure).observe(d.querySelector('#culture-dialog'),{attributes:true,subtree:true,childList:true});new MutationObserver(measure).observe(d.body,{attributes:true,attributeFilter:['class']});frame.contentWindow.addEventListener('scroll',measure,{passive:true});if(params.get('section')==='map')d.querySelector('#christmas-cultures').scrollIntoView({behavior:'instant'});measure();};addEventListener('resize',layout);layout();
</script></html>
