<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wish viewport check</title>
<style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#eee;color:#222;font:14px system-ui}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button{padding:6px 12px;cursor:pointer}#preview{margin:auto}iframe{display:block;border:0;transform-origin:top left;background:#dfeef3}p{font-size:12px}</style></head>
<body><header>Wish 渲染尺寸：<button data-width="1440">1440px</button><button data-width="1024">1024px</button><button data-width="768">768px</button><button data-width="390">390px</button><output id="size"></output></header><p>僅供本機視覺驗收；iframe 採真實 CSS viewport，外部等比縮放方便檢視。請以 localhost 開啟，避免寫入 127.0.0.1 的既有測試資料。</p><div id="preview"><iframe id="viewport" src="../wish.html" title="Wish responsive preview"></iframe></div>
<script>const frame=document.querySelector('#viewport'),box=document.querySelector('#preview');let width=1440;function layout(){const scale=Math.min(1,(document.documentElement.clientWidth-24)/width);frame.style.width=width+'px';frame.style.height='900px';frame.style.transform='scale('+scale+')';box.style.width=width*scale+'px';box.style.height=900*scale+'px';document.querySelector('#size').textContent=width+' × 900';}document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{width=Number(button.dataset.width);layout();});addEventListener('resize',layout);layout();</script></body></html>
